<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
<rect width="900" height="470" fill="#fcfcfb"/>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#898781" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<!-- Agent boundary -->
<rect x="24" y="44" width="636" height="376" rx="14" fill="none" stroke="#c3c2b7" stroke-width="1"/>
<text x="44" y="70" font-size="12" font-weight="600" letter-spacing="2" fill="#898781">AGENT</text>

<!-- Model core -->
<rect x="56" y="176" width="152" height="112" rx="10" fill="#104281"/>
<text x="132" y="228" font-size="17" font-weight="600" fill="#ffffff" text-anchor="middle">MODEL</text>
<text x="132" y="248" font-size="10.5" fill="#cde2fb" text-anchor="middle">reasoning &amp; generation</text>

<!-- Model <-> Harness arrow -->
<line x1="216" y1="232" x2="262" y2="232" stroke="#898781" stroke-width="1.6" marker-start="url(#arr)" marker-end="url(#arr)"/>

<!-- Harness container -->
<rect x="272" y="82" width="360" height="312" rx="10" fill="none" stroke="#c3c2b7" stroke-width="1"/>
<text x="292" y="106" font-size="12" font-weight="600" letter-spacing="2" fill="#898781">HARNESS</text>

<!-- Layer 1 -->
<rect x="292" y="118" width="320" height="46" rx="5" fill="#f0efec"/>
<rect x="292" y="118" width="4" height="46" rx="2" fill="#2a78d6"/>
<text x="308" y="137" font-size="13" font-weight="600" fill="#0b0b0b">Tool orchestration</text>
<text x="308" y="153" font-size="10.5" fill="#52514e">where the agent meets the real world</text>
<!-- Layer 2 -->
<rect x="292" y="172" width="320" height="46" rx="5" fill="#f0efec"/>
<rect x="292" y="172" width="4" height="46" rx="2" fill="#1baf7a"/>
<text x="308" y="191" font-size="13" font-weight="600" fill="#0b0b0b">Verification loops</text>
<text x="308" y="207" font-size="10.5" fill="#52514e">nothing is trusted on reasoning alone</text>
<!-- Layer 3 -->
<rect x="292" y="226" width="320" height="46" rx="5" fill="#f0efec"/>
<rect x="292" y="226" width="4" height="46" rx="2" fill="#eda100"/>
<text x="308" y="245" font-size="13" font-weight="600" fill="#0b0b0b">Context &amp; memory</text>
<text x="308" y="261" font-size="10.5" fill="#52514e">the right information at the right time</text>
<!-- Layer 4 -->
<rect x="292" y="280" width="320" height="46" rx="5" fill="#f0efec"/>
<rect x="292" y="280" width="4" height="46" rx="2" fill="#008300"/>
<text x="308" y="299" font-size="13" font-weight="600" fill="#0b0b0b">Guardrails</text>
<text x="308" y="315" font-size="10.5" fill="#52514e">the fences inside the wrapper</text>
<!-- Layer 5 -->
<rect x="292" y="334" width="320" height="46" rx="5" fill="#f0efec"/>
<rect x="292" y="334" width="4" height="46" rx="2" fill="#4a3aa7"/>
<text x="308" y="353" font-size="13" font-weight="600" fill="#0b0b0b">Observability</text>
<text x="308" y="369" font-size="10.5" fill="#52514e">watching what the agent thinks</text>

<!-- Harness <-> Environment arrow -->
<line x1="668" y1="232" x2="714" y2="232" stroke="#898781" stroke-width="1.6" marker-start="url(#arr)" marker-end="url(#arr)"/>

<!-- Environment -->
<rect x="724" y="150" width="152" height="164" rx="10" fill="none" stroke="#c3c2b7" stroke-width="1"/>
<text x="800" y="180" font-size="12" font-weight="600" letter-spacing="2" fill="#898781" text-anchor="middle">ENVIRONMENT</text>
<text x="800" y="212" font-size="11.5" fill="#52514e" text-anchor="middle">tools</text>
<text x="800" y="234" font-size="11.5" fill="#52514e" text-anchor="middle">APIs</text>
<text x="800" y="256" font-size="11.5" fill="#52514e" text-anchor="middle">data sources</text>
<text x="800" y="278" font-size="11.5" fill="#52514e" text-anchor="middle">people</text>

<!-- Formula caption -->
<text x="342" y="450" font-size="14" font-weight="600" fill="#0b0b0b" text-anchor="middle">Agent&#160;&#160;=&#160;&#160;Model&#160;&#160;+&#160;&#160;Harness</text>
</svg>
