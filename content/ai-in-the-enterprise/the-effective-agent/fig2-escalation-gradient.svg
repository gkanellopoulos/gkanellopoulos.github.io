<svg xmlns="http://www.w3.org/2000/svg" width="900" height="370" viewBox="0 60 900 370" font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
<rect width="900" height="430" fill="#fcfcfb"/>
<defs>
<marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
<path d="M 0 1 L 9 5 L 0 9" fill="none" stroke="#898781" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>


<!-- Level 1 -->
<rect x="60" y="180" width="220" height="150" rx="10" fill="#86b6ef"/>
<text x="76" y="206" font-size="11" font-weight="600" letter-spacing="1.5" fill="#0b0b0b">LEVEL 1</text>
<text x="76" y="228" font-size="15" font-weight="600" fill="#0b0b0b">Automated checks</text>
<text x="76" y="250" font-size="11" fill="#0b0b0b">validate &#8594; retry &#8594; flag</text>
<text x="76" y="268" font-size="11" fill="#0b0b0b">no human involvement</text>
<text x="76" y="296" font-size="11" font-style="italic" fill="#0b0b0b">covers the majority</text>
<text x="76" y="311" font-size="11" font-style="italic" fill="#0b0b0b">of agent actions</text>

<!-- escalation arrow 1 -->
<line x1="288" y1="255" x2="332" y2="235" stroke="#898781" stroke-width="1.6" marker-end="url(#arr2)"/>

<!-- Level 2 -->
<rect x="340" y="140" width="220" height="190" rx="10" fill="#256abf"/>
<text x="356" y="166" font-size="11" font-weight="600" letter-spacing="1.5" fill="#ffffff">LEVEL 2</text>
<text x="356" y="188" font-size="15" font-weight="600" fill="#ffffff">LLM-as-judge</text>
<text x="356" y="210" font-size="11" fill="#ffffff">a second model evaluates</text>
<text x="356" y="225" font-size="11" fill="#ffffff">the first agent's output</text>
<text x="356" y="253" font-size="11" font-style="italic" fill="#ffffff">flags what rules cannot:</text>
<text x="356" y="268" font-size="11" font-style="italic" fill="#ffffff">nuance, tone, factual accuracy</text>
<text x="356" y="296" font-size="11" fill="#ffffff">slower and more expensive</text>

<!-- escalation arrow 2 -->
<line x1="568" y1="215" x2="612" y2="195" stroke="#898781" stroke-width="1.6" marker-end="url(#arr2)"/>

<!-- Level 3 -->
<rect x="620" y="100" width="220" height="230" rx="10" fill="#0d366b"/>
<text x="636" y="126" font-size="11" font-weight="600" letter-spacing="1.5" fill="#ffffff">LEVEL 3</text>
<text x="636" y="148" font-size="15" font-weight="600" fill="#ffffff">Human approval gate</text>
<text x="636" y="170" font-size="11" fill="#ffffff">the harness pauses and waits</text>
<text x="636" y="185" font-size="11" fill="#ffffff">until a person reviews</text>
<text x="636" y="213" font-size="11" font-style="italic" fill="#ffffff">reserved for what we cannot undo</text>
<text x="636" y="228" font-size="11" font-style="italic" fill="#ffffff">or cannot afford to get wrong</text>

<!-- axis -->
<line x1="60" y1="360" x2="832" y2="360" stroke="#c3c2b7" stroke-width="1" marker-end="url(#arr2)"/>
<text x="60" y="382" font-size="11" fill="#898781">routine &#183; high volume</text>
<text x="840" y="382" font-size="11" fill="#898781" text-anchor="end">irreversible &#183; high impact</text>
<text x="450" y="382" font-size="11.5" font-weight="600" fill="#52514e" text-anchor="middle">cost of checking rises with the risk of being wrong</text>

<!-- footer -->
<text x="450" y="414" font-size="11" fill="#52514e" text-anchor="middle">Everything at level 3 makes the agent an expensive approval queue &#183; everything at level 1 lets mistakes reach the real world</text>
</svg>
