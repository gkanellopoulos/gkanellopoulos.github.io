<svg xmlns="http://www.w3.org/2000/svg" width="900" height="482" viewBox="0 48 900 482" font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
<rect width="900" height="530" fill="#fcfcfb"/>


<!-- connectors (behind boxes) -->
<line x1="330" y1="200" x2="410" y2="240" stroke="#e1e0d9" stroke-width="1"/>
<line x1="570" y1="200" x2="490" y2="240" stroke="#e1e0d9" stroke-width="1"/>
<line x1="330" y1="330" x2="410" y2="290" stroke="#e1e0d9" stroke-width="1"/>
<line x1="570" y1="330" x2="490" y2="290" stroke="#e1e0d9" stroke-width="1"/>

<!-- Structural model -->
<rect x="60" y="70" width="330" height="130" rx="10" fill="#ffffff" stroke="#c3c2b7" stroke-width="1"/>
<rect x="60" y="70" width="330" height="4" rx="2" fill="#2a78d6"/>
<text x="80" y="102" font-size="14.5" font-weight="600" fill="#0b0b0b">Structural model</text>
<text x="80" y="126" font-size="11.5" fill="#52514e">layered governance, progressive autonomy,</text>
<text x="80" y="142" font-size="11.5" fill="#52514e">embedded controls: every agent with a business</text>
<text x="80" y="158" font-size="11.5" fill="#52514e">owner, a risk profile and decision boundaries</text>

<!-- Identity -->
<rect x="510" y="70" width="330" height="130" rx="10" fill="#ffffff" stroke="#c3c2b7" stroke-width="1"/>
<rect x="510" y="70" width="330" height="4" rx="2" fill="#1baf7a"/>
<text x="530" y="102" font-size="14.5" font-weight="600" fill="#0b0b0b">Identity</text>
<text x="530" y="126" font-size="11.5" fill="#52514e">every agent a first-class identity: intent-based</text>
<text x="530" y="142" font-size="11.5" fill="#52514e">access, session-scoped credentials, individual</text>
<text x="530" y="158" font-size="11.5" fill="#52514e">audit trails, continuous authorization</text>

<!-- Oversight -->
<rect x="60" y="330" width="330" height="130" rx="10" fill="#ffffff" stroke="#c3c2b7" stroke-width="1"/>
<rect x="60" y="330" width="330" height="4" rx="2" fill="#eda100"/>
<text x="80" y="362" font-size="14.5" font-weight="600" fill="#0b0b0b">Oversight</text>
<text x="80" y="386" font-size="11.5" fill="#52514e">HITL, HOTL or governed autonomy: calibrated</text>
<text x="80" y="402" font-size="11.5" fill="#52514e">to reversibility and impact, watching for</text>
<text x="80" y="418" font-size="11.5" fill="#52514e">automation bias and rubber-stamping</text>

<!-- Runtime controls -->
<rect x="510" y="330" width="330" height="130" rx="10" fill="#ffffff" stroke="#c3c2b7" stroke-width="1"/>
<rect x="510" y="330" width="330" height="4" rx="2" fill="#008300"/>
<text x="530" y="362" font-size="14.5" font-weight="600" fill="#0b0b0b">Runtime controls</text>
<text x="530" y="386" font-size="11.5" fill="#52514e">governance intent turned into technical</text>
<text x="530" y="402" font-size="11.5" fill="#52514e">enforcement: for what is observable,</text>
<text x="530" y="418" font-size="11.5" fill="#52514e">deterministic and time-sensitive</text>

<!-- Blame loop center -->
<circle cx="450" cy="265" r="72" fill="#fcfcfb" stroke="#d03b3b" stroke-width="2"/>
<text x="450" y="248" font-size="11" font-weight="600" letter-spacing="1" fill="#d03b3b" text-anchor="middle">THE AGENTIC</text>
<text x="450" y="263" font-size="11" font-weight="600" letter-spacing="1" fill="#d03b3b" text-anchor="middle">BLAME LOOP</text>
<text x="450" y="284" font-size="10" fill="#52514e" text-anchor="middle">every step authorized,</text>
<text x="450" y="297" font-size="10" fill="#52514e" text-anchor="middle">no one owns the outcome</text>

<!-- footer -->
<text x="450" y="502" font-size="12" fill="#52514e" text-anchor="middle">Failures arise from misalignment across the four systems, not from any single layer&#8217;s deficiency. The gaps are where the blame loop lives.</text>
</svg>
