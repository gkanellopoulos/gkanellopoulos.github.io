{{ define "main" }}
<h1>{{ .Title }}</h1>
{{ if and (not .Params.menu) (not .Date.IsZero) }}
<p>
  <i>
    <time datetime='{{ .Date.Format "2006-01-02" }}'>
      {{ .Date.Format (default "02 Jan, 2006" .Site.Params.dateFormat) }}
    </time>
  </i>
</p>
{{ end }}
<content>
  {{ .Content }}
</content>
{{ with .GetTerms "tags" }}
<div class="post-tags">
  {{ range . }}<a href="{{ .RelPermalink }}">#{{ .LinkTitle }}</a> {{ end }}
</div>
{{ end }}
{{ end }}
